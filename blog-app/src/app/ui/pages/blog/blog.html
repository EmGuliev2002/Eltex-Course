<aside class="admin-panel">
  <button class="admin-btn" title="Добавить статью" (click)="toggleForm()">
    <img src="Post add.png" alt="Добавить статью" />
  </button>
  <button class="admin-btn" title="Просмотр статистики" (click)="toggleStats()">
    <img src="Vector.png" alt="Просмотр статистики" />
  </button>
</aside>

<dialog #statsDialog class="stats-dialog" (click)="$event.target === statsDialog ? toggleStats() : null">
  <div class="dialog-content">
    <button class="close-btn" (click)="toggleStats()">&times;</button>
    <h3>Статистика страницы</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Всего статей:</span>
        <span class="stat-value">{{ posts.length }}</span>
      </div>
    </div>
  </div>
</dialog>

<main class="container">
  <section class="blog-header">
    <h1>Моя фильмография</h1>
    <p>Здесь собраны мои любимые проекты, мысли о персонажах и небольшие истории со съёмочных площадок. Добро пожаловать за кулисы.</p>
  </section>

  <section class="articles-grid">
    @for (post of posts; track post.id) {
      <app-article-card [post]="post" (delete)="onDeletePost($event)"></app-article-card>
    } @empty {
      <div class="empty-state" style="display: block;">
        <p>Нет статей</p>
      </div>
    }
  </section>

  @if (isFormVisible) {
    <section id="formSection">
      <app-add-post-form 
        (add)="onAddPost($event)" 
        (cancel)="toggleForm()">
      </app-add-post-form>
    </section>
  }
</main>
