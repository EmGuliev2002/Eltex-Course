<div class="form-box">
  <h2>{{ formTitle() }}</h2>

  <form [formGroup]="postForm" (ngSubmit)="onSubmit()" class="article-form">
    
    <div class="form-group">
      <label for="header">Название фильма / Заголовок</label>
      <input 
        id="header" 
        type="text" 
        formControlName="title" 
        placeholder="Например: Съемки в Ла-Ла Ленде"
        [class.invalid-control]="hasError('title')"
      />
      @if (hasError('title')) {
        <div class="error-message">
          @for (errorMsg of getControlErrors('title'); track $index) {
            <small>{{ errorMsg }}</small>
          }
        </div>
      }
    </div>

    <div class="form-group">
      <label for="imageUrl">Ссылка на фото</label>
      <input 
        id="imageUrl" 
        type="url" 
        formControlName="img" 
        placeholder="Например: image.com/image.png" 
      />
    </div>

    <div class="form-group">
      <label for="text">Ваши воспоминания и мысли</label>
      <textarea 
        id="text" 
        formControlName="text" 
        placeholder="Расскажите о процессе съемок..." 
        rows="6"
        [class.invalid-control]="hasError('text')"
      ></textarea>
      
      @if (hasError('text')) {
        <div class="error-message">
          @for (errorMsg of getControlErrors('text'); track $index) {
            <small>{{ errorMsg }}</small>
          }
        </div>
      }
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="postForm.invalid"
      >
        {{ saveButtonTitle() }}
      </button>
      
      <button type="button" class="btn-cancel" (click)="cancel.emit()">Отмена</button>
    </div>
  </form>
</div>
